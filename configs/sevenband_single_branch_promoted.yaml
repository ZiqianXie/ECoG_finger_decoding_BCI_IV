# Frozen from complete-development, purged event-fold OOF evidence before the
# corresponding full-development refits inspect released-test labels.
# Each subject/finger uses one spatial bank, one wavelet tree, and one LSTM.
default:
  input_root: outputs/event_lars_e2e_ica_csp_1000hz_sevenband_ownany_lowlr_v1
  refit_root: outputs/full_development_ica_csp_sevenband_single_branch_promoted_v1
  spatial_cache_root: outputs/perfinger_ica_csp_wavelet_1000hz_sevenband_ownany_v1
  seeds: [0, 1, 2, 3, 4, 5]
  epoch_reference_seeds: [0]
  max_features: 1024
  hidden_size: 10
  near_zero_std: 1.0e-3
  candidate_scale: 1.0
  sequence_steps: 100
  sequence_stride: 25
  batch_size: 24
  unfrozen_batch_size: 4
  warmup_epochs: 8
  learning_rate: 3.0e-5
  spatial_learning_rate: 1.0e-6
  wavelet_learning_rate: 1.0e-6
  weight_decay: 1.0e-4
  output_activation: softplus
  loss: mse

subjects: {}
