version: 1

# A canonical entry is one model structure for one subject/finger pair.  An
# equal-weight ensemble is allowed only when every member has the same
# structure_id; heterogeneous cross-family blends are not canonical models.
policy:
  heterogeneous_model_soup_allowed: false
  same_structure_seed_ensemble_allowed: true
  tuning_gain_rule: selected_development_oof_pcc > initialized_development_oof_pcc
  released_test_used_for_selection: false

