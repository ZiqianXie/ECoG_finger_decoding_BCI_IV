# Frozen using only full-development, purged event-fold OOF predictions and
# morphology. Each subject/finger selects one complete single-path model; seed
# averaging never combines spatial or temporal branches.
default:
  input_root: outputs/event_lars_e2e_ica_csp_1000hz_sevenband_ownany_lowlr_v1
  refit_root: outputs/full_development_ica_csp_sevenband_single_branch_v1
  spatial_cache_root: outputs/perfinger_ica_csp_wavelet_1000hz_sevenband_ownany_v1
  seeds: [0, 1, 2, 3, 4, 5]
  epoch_reference_seeds: [0]
  max_features: 1024
  hidden_size: 10
  near_zero_std: 1.0e-3
  candidate_scale: 1.0
  sequence_steps: 100
  sequence_stride: 25
  batch_size: 24
  unfrozen_batch_size: 4
  warmup_epochs: 8
  learning_rate: 3.0e-5
  spatial_learning_rate: 1.0e-6
  wavelet_learning_rate: 1.0e-6
  weight_decay: 1.0e-4
  output_activation: softplus
  loss: mse

subjects:
  1:
    index: &prior_single_path
      input_root: outputs/event_lars_e2e_ica_csp_1000hz_all_tails2x2_hg_v1
      refit_root: outputs/full_development_ica_csp_single_branch_all_v1
      spatial_cache_root: outputs/perfinger_ica_csp_wavelet_1000hz_all_tails2x2_hg_v1
      seeds: [0, 1, 2, 3, 4, 5]
      epoch_reference_seeds: [0, 1]
      max_features: 512
      hidden_size: 10
      near_zero_std: 1.0e-3
      candidate_scale: 1.0
      sequence_steps: 100
      sequence_stride: 25
      batch_size: 24
      unfrozen_batch_size: 4
      warmup_epochs: 8
      learning_rate: 1.0e-4
      spatial_learning_rate: 3.0e-6
      wavelet_learning_rate: 3.0e-6
      weight_decay: 1.0e-4
      output_activation: softplus
      loss: mse
    little: *prior_single_path
  2:
    ring: *prior_single_path
  3:
    middle: *prior_single_path
