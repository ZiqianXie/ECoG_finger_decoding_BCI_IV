default:
  input_root: outputs/targeted_s1thumb_raw_h80_linear_v1
  # Frozen before terminal evaluation. The three-seed mean retains OOF PCC
  # 0.6288 while improving OOF state F1, velocity PCC, and rest RMS.
  seeds: [0, 1, 2]
  sequence_steps: 100
  sequence_stride: 25
  batch_size: 24
  unfrozen_batch_size: 4
  warmup_epochs: 8
  learning_rate: 1.0e-4
  spatial_learning_rate: 3.0e-6
  wavelet_learning_rate: 3.0e-6
  weight_decay: 1.0e-4
  output_activation: linear
  loss: mse

subjects: {}
